<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />

    <title>Tabela de Reservas Interativa</title>
    <style>.bloco-header::after {
  content: "\002B";
  font-size: 20px;
  font-weight: bold;
  color: #00008b;
  transition: transform 0.2s;
}

.bloco-header.active::after {
  content: "\2212";
}

.content {
  padding: 0;
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.4s ease-in-out;
  background-color: white;
  border: 1px solid #ddd;
  border-top: none;
}

/* Ajuste Técnico: Permite expansão total sem cortes */
.content.show {
  max-height: none;
}</style>
    <link rel="stylesheet" href="css/styles.css" />
  </head>

        type="text"
        id="searchInput"
        placeholder="Buscar por sala, horário, bloco ou auditório..."
      />

    <script src="main.js"></script>
